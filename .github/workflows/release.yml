name: Release

# Arma el plugin en GitHub, certifica los archivos (attestation) y publica la versión.
# Se dispara al subir un tag con el número de versión (por ejemplo 1.0.1).
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json \
            --title "${GITHUB_REF_NAME}" \
            --notes "Versión ${GITHUB_REF_NAME}: armada y certificada en GitHub Actions."
